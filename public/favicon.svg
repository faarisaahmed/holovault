<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Holo art box: the starry foil of a vintage holo. -->
    <linearGradient id="holo" x1="22" y1="16" x2="42" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b06bff"/>
      <stop offset="0.5" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d0f14"/>
  <g transform="rotate(-8 32 32)">
    <!-- A Base Set card: yellow border, and an art box with no drop shadow. -->
    <rect x="16" y="8" width="32" height="46" rx="3.5" fill="#f5c93c"/>
    <rect x="19" y="11" width="26" height="40" rx="2" fill="#1b1a2e"/>
    <rect x="21.5" y="15" width="21" height="15" rx="1" fill="url(#holo)"/>
    <circle cx="26" cy="19" r="0.9" fill="#fff"/>
    <circle cx="36.5" cy="18" r="0.7" fill="#fff"/>
    <circle cx="31" cy="25" r="0.8" fill="#fff"/>
    <circle cx="39.5" cy="26.5" r="0.6" fill="#fff"/>
    <rect x="21.5" y="34" width="21" height="2.2" rx="1.1" fill="#4a4f66"/>
    <rect x="21.5" y="39" width="15" height="2.2" rx="1.1" fill="#4a4f66"/>
    <rect x="21.5" y="44" width="18" height="2.2" rx="1.1" fill="#4a4f66"/>
  </g>
</svg>
