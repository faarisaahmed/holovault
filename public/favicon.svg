<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Holo foil across the lower half of the card: purple, cyan, pink. -->
    <linearGradient id="holo" x1="20" y1="30" x2="46" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b06bff"/>
      <stop offset="0.5" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="16" y="8" width="32" height="48" rx="5.5" transform="rotate(-10 32 32)"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d0f14"/>
  <!-- One card, split on the diagonal: Base Set gold where the light hits,
       holo foil below. Light, and no shadow. -->
  <g clip-path="url(#card)">
    <rect width="64" height="64" fill="url(#holo)"/>
    <polygon points="0,0 64,0 64,14 0,50" fill="#f5c93c"/>
  </g>
</svg>
