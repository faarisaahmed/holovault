<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Holo foil: the shift a holo card makes as it catches the light. -->
    <linearGradient id="holo" x1="12" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b06bff"/>
      <stop offset="0.45" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d0f14"/>
  <!-- A cut gem: crown on top, pavilion below. -->
  <polygon points="14,25 23,14 41,14 50,25 32,52" fill="url(#holo)"/>
  <!-- Facets -->
  <polyline points="14,25 50,25" fill="none" stroke="#0d0f14" stroke-opacity="0.45" stroke-width="1.6"/>
  <polyline points="23,14 27,25 32,52 37,25 41,14" fill="none" stroke="#0d0f14" stroke-opacity="0.45" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="27,25 32,14 37,25" fill="none" stroke="#0d0f14" stroke-opacity="0.45" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Glint -->
  <path d="M46 10 L47.3 13.7 L51 15 L47.3 16.3 L46 20 L44.7 16.3 L41 15 L44.7 13.7 Z" fill="#ffffff"/>
</svg>
